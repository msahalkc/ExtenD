# XcodeGen spec for ExtenD. Regenerate with: xcodegen generate
name: ExtenD
options:
  bundleIdPrefix: com.msahalkc.extend
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "0.2.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Tools/make-icons.sh regenerates both sets
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic         # team: Config/Local.xcconfig (see Config/Local.xcconfig.example)

targets:
  ExtenDMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - Shared
    entitlements:
      path: Mac/ExtenDMac.entitlements
      properties:
        # Data-protection keychain on macOS (device-only identity + pairing records, ADR-001 §2.2)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX)
    settings:
      base:
        PRODUCT_NAME: ExtenD
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mac
        SWIFT_OBJC_BRIDGING_HEADER: Mac/CGVirtualDisplayPrivate.h
        ARCHS: arm64                   # Apple Silicon only
        ENABLE_HARDENED_RUNTIME: YES   # required for notarization
        ENABLE_APP_SANDBOX: NO         # private CGVirtualDisplay + usbmuxd socket + CGEvent injection
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES   # menu-bar only, no Dock icon
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "ExtenD finds and connects to your iPad on the same Wi-Fi network. It never connects over the internet."
    info:
      path: Mac/Info.plist
      properties:
        NSBonjourServices: [_extend._tcp]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

  ExtenDPad:
    type: application
    platform: iOS
    sources:
      - iPad
      - Shared
    settings:
      base:
        PRODUCT_NAME: ExtenD
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pad
        TARGETED_DEVICE_FAMILY: "2"    # iPad only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "ExtenD lets your Mac find this iPad on the same Wi-Fi network. It never connects over the internet."
    info:
      path: iPad/Info.plist
      properties:
        NSBonjourServices: [_extend._tcp]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

  ExtenDTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - Mac/Session.swift     # end-to-end tests of the real Mac session over a socket pair / TCP
      - Mac/ByteStream.swift
      - Mac/USBMux.swift      # Sock helpers used by FDStream
      - Mac/TouchAssist.swift # pan / tap / momentum decisions (pure parts)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - ExtenDTests
